<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Details · LeadMS</title>
<script>if (!localStorage.getItem('lms_token')) window.location.replace('login.html');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar" id="appSidebar"></aside>

  <div class="main-wrapper">
    <header class="top-header" id="appHeader"></header>

    <main class="main">

      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">
          <svg class="sep" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          </svg>
          Home
        </a>
        <svg class="sep" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
        <a href="leads.html">Leads</a>
        <svg class="sep" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
        <span class="current" id="breadcrumbLeadName">Loading…</span>
      </nav>

      <div id="alertBox"></div>

      <!-- Hero card — populated by JS -->
      <div id="leadHeroWrapper">
        <div class="skeleton" style="height:120px;border-radius:18px;margin-bottom:18px;"></div>
      </div>

      <!-- Lead info -->
      <div class="card" id="leadInfoCard">
        <div class="card-header">
          <div>
            <div class="card-title">Lead Information</div>
            <div class="card-subtitle">Contact details and metadata</div>
          </div>
        </div>
        <div class="detail-grid" id="leadInfo">
          <div class="skeleton" style="height:68px;border-radius:10px;"></div>
          <div class="skeleton" style="height:68px;border-radius:10px;"></div>
          <div class="skeleton" style="height:68px;border-radius:10px;"></div>
          <div class="skeleton" style="height:68px;border-radius:10px;"></div>
        </div>
      </div>

      <!-- Follow-ups -->
      <div class="card" id="followupCard">
        <div class="card-header">
          <div>
            <div class="card-title">Follow-up History</div>
            <div class="card-subtitle">All recorded interactions with this lead</div>
          </div>
        </div>

        <!-- Add follow-up form -->
        <form id="followupForm" style="margin-bottom:22px;" novalidate>
          <div class="form-grid">
            <div class="field">
              <label for="followup_date">Date <span class="req">*</span></label>
              <input type="date" id="followup_date" required>
            </div>
            <div class="field">
              <label for="followup_type">Type <span class="req">*</span></label>
              <select id="followup_type" required></select>
            </div>
            <div class="field">
              <label for="next_followup_date">Next Follow-up</label>
              <input type="date" id="next_followup_date">
            </div>
            <div class="field full">
              <label for="followup_remarks">Remarks</label>
              <textarea id="followup_remarks" placeholder="What was discussed…"></textarea>
            </div>
          </div>
          <button type="submit" class="btn-primary btn-sm" id="addFollowupBtn"
                  style="margin-top:10px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 width="13" height="13">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add Follow-up
          </button>
        </form>

        <!-- Follow-up list -->
        <div id="followupList"></div>
      </div>

    </main>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/api.js"></script>
<script src="js/ui-utils.js"></script>
<script src="js/lead-details.js"></script>
</body>
</html>
