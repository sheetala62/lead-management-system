<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employees · LeadMS</title>
<script>if (!localStorage.getItem('lms_token')) window.location.replace('login.html');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar" id="appSidebar"></aside>

  <div class="main-wrapper">
    <header class="top-header" id="appHeader"></header>

    <main class="main">

      <nav class="breadcrumb">
        <a href="index.html">
          <svg class="sep" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          </svg>
          Home
        </a>
        <svg class="sep" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
        <span class="current">Employees</span>
      </nav>

      <div class="page-header">
        <div class="page-header-left">
          <h1>Employees</h1>
          <p class="subtitle">Manage the team members leads are assigned to</p>
        </div>
        <div class="page-header-actions">
          <button class="btn-primary" id="addEmpBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add Employee
          </button>
        </div>
      </div>

      <div id="alertBox"></div>

      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Status</th>
                <th>Assigned Leads</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="empTableBody"></tbody>
          </table>
        </div>
        <div id="empEmpty" class="empty-state" style="display:none;">
          <div class="empty-state-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <line x1="19" y1="8" x2="19" y2="14"/>
              <line x1="22" y1="11" x2="16" y2="11"/>
            </svg>
          </div>
          <div class="empty-state-title">No employees yet</div>
          <div class="empty-state-desc">Add your first employee and assign leads to them.</div>
          <button class="btn-primary" id="emptyAddEmpBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 width="14" height="14">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add Employee
          </button>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Add / Edit Employee Modal -->
<div class="modal-overlay" id="empModal">
  <div class="modal" style="max-width:440px;">
    <div class="modal-header">
      <span class="modal-title" id="empModalTitle">Add Employee</span>
      <button class="modal-close" id="empModalClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div id="empModalAlert" class="modal-alert"></div>
      <div class="field">
        <label for="empName">Full Name <span class="req">*</span></label>
        <input type="text" id="empName" placeholder="e.g. Rahul Sharma">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="empModalCancel">Cancel</button>
      <button class="btn-primary" id="empModalSave">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             width="13" height="13">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Save
      </button>
    </div>
  </div>
</div>

<!-- Confirm -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-dialog">
    <div class="confirm-body">
      <div class="confirm-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        </svg>
      </div>
      <div class="confirm-title">Deactivate Employee?</div>
      <div class="confirm-message" id="confirmMessage">
        This employee will no longer appear in lead assignment dropdowns.
      </div>
    </div>
    <div class="confirm-footer">
      <button class="btn-secondary" id="confirmCancelBtn">Cancel</button>
      <button class="btn-danger" id="confirmDeleteBtn">Deactivate</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/api.js"></script>
<script src="js/ui-utils.js"></script>
<script src="js/employees.js"></script>
</body>
</html>
