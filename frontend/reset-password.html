<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password · LeadMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
    </div>
    <div class="auth-card-title">Set New Password</div>
    <div class="auth-card-subtitle">Choose a strong password of at least 6 characters.</div>

    <div id="alertBox"></div>
    <div id="tokenError" style="display:none;" class="alert alert-error">This reset link is invalid or has expired. <a href="forgot-password.html">Request a new one</a>.</div>

    <form id="resetForm" class="auth-form" novalidate>
      <div class="field">
        <label for="new_password">New Password <span class="req">*</span></label>
        <input type="password" id="new_password" placeholder="Min. 6 characters" autocomplete="new-password">
        <div class="pwd-strength" id="pwdStrength" style="display:none;">
          <div class="pwd-strength-bar"><div class="pwd-strength-fill" id="pwdStrengthFill"></div></div>
          <div class="pwd-strength-label" id="pwdStrengthLabel"></div>
        </div>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm Password <span class="req">*</span></label>
        <input type="password" id="confirm_password" placeholder="Repeat password" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primary auth-submit" id="resetBtn">
        <svg id="resetSpinner" style="display:none;animation:spin 0.7s linear infinite;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        <span id="resetText">Reset Password</span>
      </button>
    </form>

    <div class="auth-footer-link"><a href="login.html">Back to Sign In</a></div>
  </div>
</div>

<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
<script src="js/api.js"></script>
<script>
const token = new URLSearchParams(window.location.search).get('token');
if (!token) {
  document.getElementById('resetForm').style.display = 'none';
  document.getElementById('tokenError').style.display = 'block';
}

// Password strength
const pwdInput = document.getElementById('new_password');
pwdInput.addEventListener('input', () => {
  const v = pwdInput.value;
  const wrap = document.getElementById('pwdStrength');
  const fill  = document.getElementById('pwdStrengthFill');
  const label = document.getElementById('pwdStrengthLabel');
  wrap.style.display = v ? 'block' : 'none';
  const score = (v.length >= 8 ? 1 : 0) + (/[A-Z]/.test(v) ? 1 : 0) + (/[0-9]/.test(v) ? 1 : 0) + (/[^A-Za-z0-9]/.test(v) ? 1 : 0);
  const levels = [['strength-weak','Weak','#dc2626'],['strength-fair','Fair','#d97706'],['strength-good','Good','#3b82f6'],['strength-strong','Strong','#059669']];
  const idx = Math.min(score - 1, 3);
  if (idx < 0) { fill.style.width='0'; label.textContent=''; return; }
  const [,lbl,col] = levels[idx];
  fill.style.width = ['25%','50%','75%','100%'][idx];
  fill.style.background = col;
  label.textContent = lbl;
  label.style.color = col;
});

document.getElementById('resetForm').addEventListener('submit', async e => {
  e.preventDefault();
  const alertBox = document.getElementById('alertBox');
  alertBox.innerHTML = '';
  const pwd  = document.getElementById('new_password').value;
  const conf = document.getElementById('confirm_password').value;
  if (pwd.length < 6) { alertBox.innerHTML = '<div class="alert alert-error">Password must be at least 6 characters.</div>'; return; }
  if (pwd !== conf)   { alertBox.innerHTML = '<div class="alert alert-error">Passwords do not match.</div>'; return; }

  const btn = document.getElementById('resetBtn');
  btn.disabled = true;
  document.getElementById('resetSpinner').style.display = 'inline-block';
  document.getElementById('resetText').textContent = 'Resetting…';

  try {
    await api.resetPassword({ token, new_password: pwd });
    alertBox.innerHTML = '<div class="alert alert-success">Password reset successfully! Redirecting to login…</div>';
    setTimeout(() => window.location.href = 'login.html', 2000);
  } catch (err) {
    alertBox.innerHTML = `<div class="alert alert-error">${err.message || 'Reset failed. The link may have expired.'}</div>`;
    btn.disabled = false;
    document.getElementById('resetSpinner').style.display = 'none';
    document.getElementById('resetText').textContent = 'Reset Password';
  }
});
</script>
</body>
</html>
