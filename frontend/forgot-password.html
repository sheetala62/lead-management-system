<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password · LeadMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div class="auth-card-title">Forgot Password?</div>
    <div class="auth-card-subtitle">Enter your username or email and we will send you a reset link.</div>

    <div id="alertBox"></div>

    <form id="forgotForm" class="auth-form" novalidate>
      <div class="field">
        <label for="identifier">Username or Email <span class="req">*</span></label>
        <input type="text" id="identifier" placeholder="Enter your username or email" autocomplete="username" required>
      </div>
      <button type="submit" class="btn-primary auth-submit" id="submitBtn">
        <svg id="submitSpinner" style="display:none;animation:spin 0.7s linear infinite;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        <span id="submitText">Send Reset Link</span>
      </button>
    </form>

    <div class="auth-footer-link">
      Remembered it? <a href="login.html">Back to Sign In</a>
    </div>
  </div>
</div>

<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
<script src="js/api.js"></script>
<script>
const form       = document.getElementById('forgotForm');
const alertBox   = document.getElementById('alertBox');
const spinner    = document.getElementById('submitSpinner');
const submitText = document.getElementById('submitText');
const submitBtn  = document.getElementById('submitBtn');

form.addEventListener('submit', async e => {
  e.preventDefault();
  alertBox.innerHTML = '';
  const val = document.getElementById('identifier').value.trim();
  if (!val) { alertBox.innerHTML = '<div class="alert alert-error">Please enter your username or email.</div>'; return; }

  const isEmail = val.includes('@');
  submitBtn.disabled = true; spinner.style.display = 'inline-block'; submitText.textContent = 'Sending…';

  try {
    await api.forgotPassword(isEmail ? { email: val } : { username: val });
    alertBox.innerHTML = '<div class="alert alert-success">If that account exists, a password reset link has been sent to its email address. Check your inbox.</div>';
    form.reset();
  } catch (err) {
    alertBox.innerHTML = `<div class="alert alert-error">${err.message || 'Something went wrong. Please try again.'}</div>`;
  } finally {
    submitBtn.disabled = false; spinner.style.display = 'none'; submitText.textContent = 'Send Reset Link';
  }
});
</script>
</body>
</html>
