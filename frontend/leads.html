<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads · LeadMS</title>
<script>if (!localStorage.getItem('lms_token')) window.location.replace('login.html');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar" id="appSidebar"></aside>

  <div class="main-wrapper">
    <header class="top-header" id="appHeader"></header>

    <main class="main">

      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">
          <svg class="sep" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          </svg>
          Home
        </a>
        <svg class="sep" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
        <span class="current">Leads</span>
      </nav>

      <div class="page-header">
        <div class="page-header-left">
          <h1>Leads</h1>
          <p class="subtitle">Manage all your enquiries</p>
        </div>
        <div class="page-header-actions">
          <button class="btn-primary" id="openAddBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add Lead
          </button>
        </div>
      </div>

      <div id="alertBox"></div>

      <div class="card">
        <!-- Toolbar -->
        <div class="toolbar">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="searchInput" class="search-box"
                   placeholder="Search by name, company, mobile…">
          </div>
          <select id="statusFilter"><option value="">All Statuses</option></select>
          <select id="serviceFilter"><option value="">All Services</option></select>
          <select id="assignedFilter"><option value="">All Assignees</option></select>
          <select id="sortBy">
            <option value="date">Sort: Date</option>
            <option value="estimated_value">Sort: Value</option>
            <option value="lead_name">Sort: Name</option>
          </select>
          <select id="sortDir">
            <option value="desc">Newest first</option>
            <option value="asc">Oldest first</option>
          </select>
        </div>

        <!-- Table -->
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Lead</th>
                  <th>Service</th>
                  <th>Status</th>
                  <th>Assigned To</th>
                  <th>Est. Value</th>
                  <th>Created</th>
                  <th>Actions</th>
              </tr>
            </thead>
            <tbody id="leadsTableBody"></tbody>
          </table>
        </div>

        <!-- Empty state -->
        <div id="emptyState" class="empty-state" style="display:none;">
          <div class="empty-state-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <line x1="19" y1="8" x2="19" y2="14"/>
              <line x1="22" y1="11" x2="16" y2="11"/>
            </svg>
          </div>
          <div class="empty-state-title">No leads found</div>
          <div class="empty-state-desc">
            Try adjusting your filters or add your first lead.
          </div>
          <button class="btn-primary" id="emptyAddBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                 width="14" height="14">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add New Lead
          </button>
        </div>

        <div class="pagination" id="pagination"></div>
      </div>

    </main>
  </div>
</div>

<!-- ── Add / Edit Lead Modal ── -->
<div class="modal-overlay" id="leadModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Add New Lead</span>
      <button class="modal-close" id="cancelModalBtn" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div id="modalAlert" class="modal-alert"></div>
      <form id="leadForm" novalidate>
        <input type="hidden" id="leadId">
        <div class="form-grid">
          <div class="field">
            <label for="lead_name">Lead Name <span class="req">*</span></label>
            <input type="text" id="lead_name" placeholder="Full name">
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label for="company_name">Company <span class="req">*</span></label>
            <input type="text" id="company_name" placeholder="Company name">
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label for="mobile">Mobile <span class="req">*</span></label>
            <input type="tel" id="mobile" inputmode="numeric"
                   pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile">
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label for="email">Email <span class="req">*</span></label>
            <input type="email" id="email" placeholder="email@company.com">
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label for="service_required">Service <span class="req">*</span></label>
            <select id="service_required"></select>
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label for="lead_source">Source <span class="req">*</span></label>
            <select id="lead_source"></select>
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label for="estimated_value">Est. Value (₹)</label>
            <input type="number" id="estimated_value" min="0" step="any" placeholder="0">
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label for="assigned_to">Assigned To <span class="req">*</span></label>
            <select id="assigned_to"></select>
            <div class="field-error"></div>
          </div>
          <div class="field full">
            <label for="lead_status">Status <span class="req">*</span></label>
            <select id="lead_status"></select>
            <div class="field-error"></div>
          </div>
          <div class="field full">
            <label for="remarks">Remarks</label>
            <textarea id="remarks" placeholder="Any notes…"></textarea>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn-secondary" id="cancelModalBtnFooter">Cancel</button>
      <button type="submit" class="btn-primary" id="saveLeadBtn" form="leadForm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             width="13" height="13">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Save Lead
      </button>
    </div>
  </div>
</div>

<!-- ── Confirm Delete ── -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-dialog">
    <div class="confirm-body">
      <div class="confirm-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6"/><path d="M14 11v6"/>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
      </div>
      <div class="confirm-title">Delete Lead?</div>
      <div class="confirm-message" id="confirmMessage">
        This will permanently delete the lead and all follow-up history.
      </div>
    </div>
    <div class="confirm-footer">
      <button class="btn-secondary" id="confirmCancelBtn">Cancel</button>
      <button class="btn-danger" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="js/api.js"></script>
<script src="js/ui-utils.js"></script>
<script src="js/leads.js"></script>
</body>
</html>
